<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>אליאס – משחק מילים לכל המשפחה</title>
    <meta name="theme-color" content="#E30613" />
    <meta name="description" content="אליאס – משחק ניחוש מילים בעברית לכל המשפחה" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #E30613;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* No pull-to-refresh / page bounce while dragging the board. */
        overscroll-behavior: none;
        /* No double-tap zoom, without delaying or swallowing fast taps. */
        touch-action: manipulation;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      יש להפעיל JavaScript כדי לשחק באליאס.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // A pinch should zoom the 3D board, never the whole page (the app handles two-finger
      // gestures itself). Safari ignores user-scalable=no, so block its gesture events too.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener('touchmove', function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    </script>

</body>
</html>
